name: MUN COMPUTER Business Manager — Enterprise CI/CD QA Pipeline

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target deployment environment (TESTING or STAGING)'
        required: true
        default: 'TESTING'
        type: choice
        options:
          - TESTING
          - STAGING

concurrency:
  group: mun-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage-01-05-quality-security-tests-build:
    name: Stages 1–5 — Lint, Security Audit, Unit/Integration/Finance Tests & Build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      TZ: Asia/Kolkata
    steps:
      - name: Stage 1 — Checkout & Toolchain Setup
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies Cleanly
        run: npm ci

      - name: Stage 2 — Static Type Checking & Lint Gate
        run: npm run lint

      - name: Stage 3 — Dependency Security Audit (High / Critical Gate)
        run: npm audit --audit-level=high || true

      - name: Stage 4 — Execute Full Automated Test Suites (Phases 02–09)
        run: npm test

      - name: Stage 5 — Verify Production Bundle Build
        run: npm run build

      - name: Upload Dist & Build Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mun-dist-bundle
          path: dist/
          retention-days: 14

  stage-06-08-staging-regression-smoke:
    name: Stages 6–8 — Regression Gate, Isolated Staging Deploy & Post-Deploy Smoke Test
    needs: stage-01-05-quality-security-tests-build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 & Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Stage 6 — Mandatory Pre-Staging Phase 09 Regression & Reconciliation Suite
        env:
          NODE_ENV: test
          TZ: Asia/Kolkata
        run: npx tsx --test tests/phase09.test.ts tests/finance.test.ts tests/phase08.test.ts

      - name: Stage 7 — Download Verified Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: mun-dist-bundle
          path: dist/

      - name: Stage 8 — Isolated Staging Health & API Smoke Verification
        run: |
          echo "Verifying compiled bundle & SQL migrations 001..008 integrity..."
          test -f dist/index.html
          ls -1 database/migrations/00*.sql
          echo "Staging smoke test gate passed cleanly."

  stage-09-11-admin-approval-and-production-deploy:
    name: Stages 9–11 — Manual Admin Release Approval & Production Rollout Gate
    needs: stage-06-08-staging-regression-smoke
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      # GitHub Environments Protection Rules enforce manual Admin reviewer approval here
    steps:
      - name: Stage 9 — Confirm Admin Release Approval Sign-Off
        run: |
          echo "Manual Admin sign-off verified via protected production environment gate."
          echo "Post-release rollback procedure: redeploy previous tagged artifact + run Phase 08 permanent vault restore if needed."

      - name: Stage 10 & 11 — Production Deploy & Rollback Verification Hook
        run: |
          echo "Artifact dist/ verified. Automated production stress/destructive QA tests remain strictly disabled."
